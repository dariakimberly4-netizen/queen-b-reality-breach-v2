<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queen B — Reality Breach</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09030f;color:#fff;font-family:Arial,sans-serif}
body{background:radial-gradient(circle at 50% 12%,#52246d 0,#1c0a2d 45%,#07020b 100%);padding-bottom:92px}
main{width:min(100%,620px);margin:auto;padding:24px 18px 30px;text-align:center}
.crown{font-size:48px;color:#efd16f;text-shadow:0 0 28px #d58cff;margin-top:4px}
h1{font:700 clamp(38px,11vw,62px) Georgia,serif;margin:6px 0 4px}
.sub{font-size:11px;font-weight:800;letter-spacing:.25em;color:#efd16f;margin-bottom:20px}
.frame{height:58vh;max-height:620px;min-height:360px;border:1px solid #b980d366;border-radius:28px;padding:10px;background:#ffffff08;display:grid;place-items:center;overflow:hidden}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:20px}
#status{margin:14px 0;font-weight:900;letter-spacing:.12em}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#12051ff2;justify-content:center}
button{appearance:none;border:0;border-radius:999px;background:#efd16f;color:#160921;font-weight:900;font-size:14px;min-height:54px;padding:12px 18px;touch-action:manipulation}
#reality{display:none;position:fixed;inset:0;z-index:100;background:#020103;place-items:center;padding:28px;text-align:center}
#sys{font:800 clamp(22px,7vw,44px) monospace;max-width:900px}.glitch{animation:g .13s infinite}
@keyframes g{50%{transform:translate(3px,-2px);text-shadow:-5px 0 #9a39ff,5px 0 #efd16f}}
body.crack:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:linear-gradient(62deg,transparent 49.7%,#ead8ff77 50%,transparent 50.3%)}
@media(max-height:700px){.frame{height:48vh;min-height:280px}.crown{font-size:36px}h1{font-size:38px}}
</style></head>
<body>
<main><div class="crown">♛</div><h1>QUEEN B</h1><div class="sub">REALITY BREACH · CLEAN BUILD</div>
<div class="frame"><img id="photo" alt="Queen B memory"></div><div id="status">MEMORY 001 / 100</div></main>
<div class="controls"><button id="next" type="button">NEXT MEMORY</button><button id="test" type="button">TEST MEMORY 100</button></div>
<div id="reality"><div id="sys"></div></div>
<script>
const ids=["1zh1cxp5hcBl0ZGsoIercv51RSxszmMSb","1-QVlGgM0BqfcUQqWcQLNPlzoDztmzcpg","1ONzcyGleKAL39Wl3BP4JHSF04wpkuUxT","1_-ca47E29UUEVxlmK64GAN_tZ4YQfbaP","1L9YqKXnmXQx6j-xS2dp6QvOfu4oHi1q7","1SMMWYdG0DtjnhH_u9KYqBRS_eNX4Ls2l","19hKTEOxavIecIMoJbimuODSOJXK-4Np6","1Yxjpv34EWj758TA_FuRB4_R1RHGeZ6eL","1frYwatctg6od3LQhvl3atnZTjDDCNAxP","1HBeZ7kuMR_OXKO3IaZOTlFnsIcV16mOu"];
let n=0;
const photo=document.getElementById("photo"),status=document.getElementById("status"),reality=document.getElementById("reality"),sys=document.getElementById("sys");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function show(){const m=n+1;photo.src="https://drive.google.com/thumbnail?id="+ids[n]+"&sz=w1600";status.textContent="MEMORY "+String(m).padStart(3,"0")+" / 100";document.body.classList.toggle("crack",m>=10)}
async function finale(){
 reality.style.display="grid";
 for(const [t,d] of [["SEARCHING FOR MEMORY 100…",1300],["ERROR: MEMORY NOT FOUND",1300],["SUBJECT EXISTS OUTSIDE WEBSITE",1700],["OPENING REALITY…",1500]]){sys.textContent=t;sys.className="glitch";await wait(d)}
 const v=document.createElement("video");v.controls=true;v.playsInline=true;v.src="VID-20260915-WA0000.mp4";v.style.cssText="position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:200";document.body.appendChild(v);reality.style.display="none";
 try{await v.play()}catch(e){}
 v.addEventListener("ended",()=>{v.remove();ending()},{once:true});
}
async function ending(){reality.style.display="grid";for(const [t,d] of [["THE END",1400],["THE END̶",1200],["100 / 100",1100],["100 / ∞",1600]]){sys.textContent=t;sys.className="glitch";await wait(d)}sys.className="";sys.innerHTML="You thought this was a birthday website.<br><br><b>It was only the beginning.</b><br><br><span style='font-size:2em;color:#efd16f'>♛</span>"}
document.getElementById("next").addEventListener("click",()=>{if(n>=98){finale();return}n++;show()});
document.getElementById("test").addEventListener("click",finale);
show();
</script></body></html>
